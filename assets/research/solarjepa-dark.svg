<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">SolarJEPA conceptual workflow</title>
  <desc id="desc">Sky imagery and time-series signals are aligned to support forecasting. The signal is a schematic symbol, not an experimental curve.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#79adff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="feedback-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#5ed6c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .icon { fill:none; stroke:#79adff; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
      .accent { stroke:#5ed6c4; }
      .subtle { stroke:#a6b3c5; opacity:.8; }
      .solid { fill:#79adff; stroke:none; }
      .label { fill:#e6edf3; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:30px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="200" rx="16" fill="#101925"/>
  <!-- The connecting paths encode process order, not measured performance. -->
  <path d="M264 99H300" fill="none" stroke="#79adff" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M498 99H534" fill="none" stroke="#79adff" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <g>
    <rect x="24" y="28" width="236" height="140" rx="12" fill="#172231" stroke="#304155"/>
    <g class="icon" transform="translate(142 79)"><g transform="translate(-35 0)"><circle cx="-8" cy="-7" r="10"/><path d="M-8-24v-5M-25-7h-5M-21-20l-4-4M4-20l4-4" class="subtle"/><path d="M-15 15h34a10 10 0 0 0 0-20 14 14 0 0 0-26-1 11 11 0 0 0-8 21z" class="accent"/></g><path d="M12 16h10V0h12v-16h12V8h12V-4h14"/><path d="M0-20v42" class="subtle"/></g>
    <text class="label" x="142" y="130" style="font-size:28px"><tspan x="142">Sky +</tspan><tspan x="142" dy="26">Time Series</tspan></text>
  </g>
  <g>
    <rect x="306" y="28" width="188" height="140" rx="12" fill="#172231" stroke="#304155"/>
    <g class="icon" transform="translate(400 79)"><path d="M-29-18h15l11 11M-29 18h15l11-11"/><path d="m-10-7 7 0 0-7M-10 7h7v7"/><rect x="8" y="-21" width="23" height="42" rx="5" class="accent"/><path d="M15-8h9M15 0h9M15 8h9" class="accent"/></g>
    <text class="label" x="400" y="142" style="font-size:30px">Align</text>
  </g>
  <g>
    <rect x="540" y="28" width="236" height="140" rx="12" fill="#172231" stroke="#304155"/>
    <g class="icon" transform="translate(658 79)"><path d="M-28 16h56M-19 16a19 19 0 0 1 38 0"/><path d="M0-14v-8M-24-8l-5-6M24-8l5-6" class="subtle"/><path d="M-10 28h34m-7-7 7 7-7 7" class="accent"/></g>
    <text class="label" x="658" y="142" style="font-size:30px">Forecast</text>
  </g>
</svg>
