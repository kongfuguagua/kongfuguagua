<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Agile Dispatch Agent conceptual workflow</title>
  <desc id="desc">A natural-language intent is translated into tool use, solving and validation. A feedback loop returns validation to intent.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="feedback-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .icon { fill:none; stroke:#2563eb; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
      .accent { stroke:#0f766e; }
      .subtle { stroke:#59677a; opacity:.8; }
      .solid { fill:#2563eb; stroke:none; }
      .label { fill:#1f2937; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:30px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="200" rx="16" fill="#f6f8fa"/>
  <!-- The connecting paths encode process order, not measured performance. -->
  <path d="M196 99H213" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M391 99H408" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M586 99H603" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M692.5 167v9a8 8 0 0 1-8 8H116a8 8 0 0 1-8-8v-7" fill="none" stroke="#0f766e" stroke-width="2" opacity=".75" marker-end="url(#feedback-arrow)"/>
  <g>
    <rect x="24" y="28" width="168" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(108 79)"><path d="M-25-19h50v29H1L-12 21V10h-13z"/><path d="M-14-8h28M-14 0H6" class="accent"/></g>
    <text class="label" x="108" y="142" style="font-size:30px">Intent</text>
  </g>
  <g>
    <rect x="219" y="28" width="168" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(303 79)"><path d="M-4-16a15 15 0 0 1 19-5L5-11l6 6 10-10a15 15 0 0 1-19 19l-17 17a6 6 0 0 1-9-9L-7-5a15 15 0 0 1 3-11z"/><circle cx="-19" cy="17" r="1.5" class="solid"/></g>
    <text class="label" x="303" y="142" style="font-size:30px">Tools</text>
  </g>
  <g>
    <rect x="414" y="28" width="168" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(498 79)"><path d="M-13-21h-11v42h11M13-21h11v42H13"/><path d="m-8-11 13 11-13 11M-5 0h18" class="accent"/></g>
    <text class="label" x="498" y="142" style="font-size:30px">Solve</text>
  </g>
  <g>
    <rect x="609" y="28" width="167" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(692.5 79)"><path d="M0-25 23-16v17c0 12-13 20-23 25-10-5-23-13-23-25v-17z"/><path d="m-11-1 8 9 16-18" class="accent"/></g>
    <text class="label" x="692.5" y="142" style="font-size:30px">Validate</text>
  </g>
</svg>
