<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Simulation Optimization Agent conceptual workflow</title>
  <desc id="desc">Measurements inform a simulation, which is refined through an iterative feedback loop. This diagram does not show experimental results.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="feedback-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .icon { fill:none; stroke:#2563eb; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
      .accent { stroke:#0f766e; }
      .subtle { stroke:#59677a; opacity:.8; }
      .solid { fill:#2563eb; stroke:none; }
      .label { fill:#1f2937; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-size:30px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="200" rx="16" fill="#f6f8fa"/>
  <!-- The connecting paths encode process order, not measured performance. -->
  <path d="M264 99H300" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M498 99H534" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <path d="M658 167v9a8 8 0 0 1-8 8H150a8 8 0 0 1-8-8v-7" fill="none" stroke="#0f766e" stroke-width="2" opacity=".75" marker-end="url(#feedback-arrow)"/>
  <g>
    <rect x="24" y="28" width="236" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(142 79)"><path d="M-27 15v-12a27 27 0 0 1 54 0v12z"/><path d="M-17 3l-4-2M-11-10l-2-4M4-16l1-4M17-7l3-3" class="subtle"/><path d="m0 8 12-20" class="accent"/><circle cx="0" cy="8" r="4" class="solid"/></g>
    <text class="label" x="142" y="142" style="font-size:30px">Measurements</text>
  </g>
  <g>
    <rect x="306" y="28" width="188" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(400 79)"><path d="m0-26 26 14v29L0 31l-26-14v-29zM-26-12 0 2l26-14M0 2v29"/><path d="m-13-19 26 14M-13-5v28M13-5v28M-26 2 0 16 26 2" class="subtle"/></g>
    <text class="label" x="400" y="142" style="font-size:30px">Simulation</text>
  </g>
  <g>
    <rect x="540" y="28" width="236" height="140" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <g class="icon" transform="translate(658 79)"><path d="M-25-17h50M-25 0h50M-25 17h50" class="subtle"/><circle cx="-10" cy="-17" r="6"/><circle cx="13" cy="0" r="6" class="accent"/><circle cx="-3" cy="17" r="6"/></g>
    <text class="label" x="658" y="142" style="font-size:30px">Refine</text>
  </g>
</svg>
